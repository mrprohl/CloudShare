# ============================================================================
# CloudShare – hardened; included by /opt/cloudshare/docker-compose.yml, variables from env/versions.env
# Settings and secrets come from /opt/cloudshare/env/cloudshare.env (written by setup.sh). The deploy tool
# (Portainer/Dockhand) needs read access to /opt. GitHub builds the image (.github/workflows/image.yml).
#
# Self-contained: Caddy in this stack terminates TLS (Let's Encrypt) on ports 80/443 and forwards to CloudShare.
# CloudShare reaches Entra ID/Graph, Nextcloud and Vaultwarden through their public addresses.
#   /opt/cloudshare/caddy/Caddyfile   site configuration (ro)
#   Volume cloudshare_data -> /data   encrypted Nextcloud app passwords – back up
#   Volume caddy_data                 certificates
# Networks:
#   internal – Caddy ↔ CloudShare only, no outbound access
#   edge     – Caddy: published ports, ACME
#   egress   – CloudShare: outbound connections
# ============================================================================

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    <<: *hardening
    container_name: cloudshare-caddy
    image: caddy:${CADDY_VERSION:-2-alpine}
    restart: unless-stopped
    cap_add: [NET_BIND_SERVICE]                 # ports 80/443 inside the container
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 100
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"                           # HTTP/3
    networks:
      edge: {}
      internal: {}
    volumes:
      - /opt/cloudshare/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CLOUDSHARE_HOST: ${CLOUDSHARE_HOST:?set in env/versions.env}
    depends_on: [cloudshare]

  cloudshare:
    <<: *hardening
    container_name: cloudshare
    hostname: cloudshare
    image: ${CLOUDSHARE_IMAGE:-ghcr.io/mrprohl/cloudshare}:${CLOUDSHARE_VERSION:?set in env/versions.env}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/public:uid=1000,gid=1000,mode=755        # add-in files, generated from the image at startup
      - /home/node/.bw:uid=1000,gid=1000,mode=700     # Bitwarden CLI session, logged in again at every start
    pids_limit: 200
    mem_limit: 768m
    networks:
      internal: {}                              # requests from Caddy
      egress: {}                                # Entra ID/Graph, Nextcloud, Vaultwarden
    volumes:
      - data:/data
    # Entra ID, Nextcloud, Vaultwarden service account, CREDENTIAL_KEY (setup.sh)
    env_file: [/opt/cloudshare/env/cloudshare.env]
    environment:
      TZ: "${TZ:-Europe/Berlin}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  data:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  edge: {}
  egress: {}
