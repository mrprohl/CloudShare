# ============================================================================
# CloudShare – build the image and push it to the GitHub Container Registry
#   ghcr.io/<owner>/cloudshare:latest      on every push to main (code changes)
#   ghcr.io/<owner>/cloudshare:sha-<id>    additionally per commit – to pin or roll back
#   ghcr.io/<owner>/cloudshare:<version>   on a Git tag v<version> (e.g. v1.2.0 → 1.2.0)
# On the server: update the stack "cloudshare" with re-pull (like Vaultwarden).
# ============================================================================
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "addin/**"
      - "server/**"
      - "docker/**"
      - "Dockerfile"
      - "setup.sh"
      - "compose.yml"
      - "docker-compose.yml"
      - "versions.env.example"
      - "caddy/**"
      - "ci/**"
      - ".github/workflows/image.yml"
  # Pull requests (e.g. from Dependabot) run every check, including the stack smoke test, but publish nothing.
  pull_request:
    branches: [main]
    paths:
      - "addin/**"
      - "server/**"
      - "docker/**"
      - "Dockerfile"
      - "setup.sh"
      - "compose.yml"
      - "docker-compose.yml"
      - "versions.env.example"
      - "caddy/**"
      - "ci/**"
      - ".github/workflows/image.yml"
      - ".github/dependabot.yml"
  workflow_dispatch: {}

# Actions are pinned to commit SHAs (tags can be moved); Dependabot updates SHA and version comment together.
permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Checks before anything is built – the image is only built if all of them pass.
  test:
    # Only the public repository builds and publishes the image; private copies (deployment forks) skip it.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Backend – install, type check, tests
        working-directory: server
        run: npm install --no-audit --no-fund && npm run typecheck && npm test

      # Runtime dependencies only – dev tools (vitest, typescript) are not part of the image.
      - name: Backend – npm audit (high and critical)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      - name: Add-in – install, type check, tests
        working-directory: addin
        run: npm install --no-audit --no-fund && npm run typecheck && npm test

      # Schema and Office validation service; placeholders are filled by the script.
      - name: Add-in – validate manifest
        working-directory: addin
        run: npm run validate:manifest

      # ShellCheck is preinstalled on the runner; info/style notes do not fail the build.
      - name: ShellCheck
        run: shellcheck --severity=warning setup.sh docker/entrypoint.sh ci/stack.sh ci/fake-bw/bw

      # setup.sh with dummy answers (file modes, generated values), docker compose config for the stub and
      # compose.yml, caddy validate for the Caddyfile.
      - name: Deployment files – setup.sh, Compose, Caddyfile
        run: ci/stack.sh validate

  # Taskpane in Chromium (Playwright): Office.js and API mocked; flows, mail changes, accessibility (axe, WCAG 2 AA),
  # light/dark theme, taskpane width. Report with screenshots as artifact "ui-test-report".
  ui:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Add-in – UI tests (Playwright, Chromium)
        working-directory: addin
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium && npm run test:ui

      - name: Upload UI test report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-report
          path: addin/playwright-report
          retention-days: 14

  build:
    needs: [test, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Registry login and push only for main and tags – pull requests are tested but publish nothing.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/cloudshare
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=CloudShare
            org.opencontainers.image.description=Outlook add-in: large attachments as password-protected Nextcloud link

      # 1. Build locally for the vulnerability scan (not pushed yet).
      # amd64 only. For ARM hosts (e.g. Raspberry Pi) add linux/arm64 –
      # the build then takes considerably longer because of emulation.
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: cloudshare:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Trivy: fail on critical/high vulnerabilities that already have a fix (unfixed ones cannot be acted on).
      - name: Trivy vulnerability scan
        # Pinned to the commit of v0.36.0 (2026-04-22) – tags of this action were re-published in March 2026.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cloudshare:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      # 3. Start the real stack (this image + Caddy, dummy settings, Bitwarden CLI mocked) and test it from outside:
      #    TLS and redirect, security headers, add-in files and placeholders, API, request size limit, hardening.
      - name: Stack smoke test
        run: ci/stack.sh smoke cloudshare scan

      # 4. Data written by the currently published image (connections, password jobs) must still be readable by
      #    the new one, which must start on it – an update must never force users to reconnect.
      - name: Upgrade test
        run: ci/stack.sh upgrade ghcr.io/${{ github.repository_owner }}/cloudshare:latest cloudshare scan

      # 5. k6: 10 users upload 2 × 45 MiB each in parallel through Caddy (Nextcloud and Microsoft token keys mocked):
      #    no failed request, p95 < 3 s per chunk, every byte arrives, memory below 80 % of the container limit.
      - name: Load test
        run: ci/stack.sh load cloudshare scan

      # 6. Push – reuses the layers from step 1 via the build cache.
      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
